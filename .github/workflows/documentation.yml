name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'documentation/reference/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reference artifact checks
        run: python3 -I -S documentation/reference/test_verify.py
      - name: Require the latest released renderer and complete reference coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(gh api repos/codeclew/codeclew/releases/latest --jq .tag_name)
          release_commit=$(gh api "repos/codeclew/codeclew/commits/$release_tag" --jq .sha)
          python3 -I -S documentation/reference/verify.py --root docs \
            --expected-version "$release_tag" --expected-commit "$release_commit"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
