name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'documentation/reference/**'
      - 'documentation/docusaurus/**'
      - 'documentation/rendering/**'
      - 'documentation/current/**'
      - 'documentation/markdown-tables/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test reference and additive-variant guards
        run: |
          python3 -I -S documentation/reference/test_verify.py
          python3 -I -S documentation/docusaurus/test_variant.py
      - name: Validate pinned publication mode and complete reference coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          native_mode=$(python3 -I -S documentation/docusaurus/variant.py native-mode)
          if [ "$native_mode" = pinned ]; then
            # Verify the unchanged frozen native tree before the declared site navigation composition.
            release_tag=v0.13.39
            release_commit=$(gh api "repos/codeclew/codeclew/commits/$release_tag" --jq .sha)
            test "$release_commit" = 7880663be0b8b8dcefd197768fbc1593f0dddb4b
            python3 -I -S documentation/reference/verify.py --root docs \
              --publication-policy documentation/reference/publication.json \
              --expected-version "$release_tag" --expected-commit "$release_commit"
            exit 0
          fi
          mode=$(python3 -c 'import json; print(json.load(open("documentation/reference/publication.json"))["mode"])')
          case "$mode" in
            accepted-source)
              python3 -I -S documentation/reference/verify.py --root docs \
                --publication-policy documentation/reference/publication.json
              source_commit=$(python3 -c 'import json; print(json.load(open("documentation/reference/publication.json"))["renderer"]["sourceRevision"])')
              resolved_commit=$(gh api "repos/codeclew/codeclew/commits/$source_commit" --jq .sha)
              test "$resolved_commit" = "$source_commit"
              ;;
            latest-release)
              release_tag=$(gh api repos/codeclew/codeclew/releases/latest --jq .tag_name)
              release_commit=$(gh api "repos/codeclew/codeclew/commits/$release_tag" --jq .sha)
              python3 -I -S documentation/reference/verify.py --root docs \
                --publication-policy documentation/reference/publication.json \
                --expected-version "$release_tag" --expected-commit "$release_commit"
              ;;
            *) printf '%s\n' 'Unsupported reference publication mode' >&2; exit 1 ;;
          esac
      - name: Verify frozen Docusaurus source and independent acceptance
        run: python3 -I -S documentation/docusaurus/variant.py verify
      - name: Verify current official release and complete field preservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(python3 -c 'import json; print("v"+json.load(open("documentation/current/publication.json"))["renderer"]["version"])')
          release_commit=$(gh api "repos/codeclew/codeclew/commits/$release_tag" --jq .sha)
          test "$(gh api "repos/codeclew/codeclew/releases/tags/$release_tag" --jq .tag_name)" = "$release_tag"
          python3 -I -S documentation/current/verify.py --version "$release_tag" --revision "$release_commit"
      - name: Build current Docusaurus documentation
        working-directory: documentation/current/project
        env:
          CODECLEW_DOCS_URL: https://codeclew.github.io
          CODECLEW_DOCS_BASE_URL: /clew-weather-demo/current/docusaurus/
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --config ../docusaurus.config.mjs
      - name: Build the separate Docusaurus version
        working-directory: documentation/docusaurus/project
        env:
          CODECLEW_DOCS_URL: https://codeclew.github.io
          CODECLEW_DOCS_BASE_URL: /clew-weather-demo/docusaurus/
          CODECLEW_DOCS_REVIEW_INDEX: 'true'
        run: |
          export CODECLEW_DOCS_GENERATOR_REVISION="$(python3 -c 'import json; print(json.load(open("../publication.json"))["identity"]["renderer"]["sourceRevision"])')"
          npm ci --no-audit --no-fund
          npm run build -- --config ../../rendering/docusaurus.config.mjs
      - name: Check deep deployment paths and assemble both versions
        run: |
          python3 -I -S documentation/docusaurus/variant.py verify-build --showcase-navigation
          python3 -I -S documentation/rendering/build.py --output pages-output
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output
      - uses: actions/deploy-pages@v4
        id: deployment
